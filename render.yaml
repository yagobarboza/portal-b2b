services:
  # Configuracao legada, mantida apenas para referencia durante a migracao ao
  # Google Cloud. Auto deploy desativado para nao publicar uma arquitetura sem
  # migration job e scheduler dedicados.
  # ===== API (Web) =====
  - type: web
    name: portal-b2b-api
    runtime: docker
    repo: https://github.com/yagobarboza/portal-b2b
    plan: free
    branch: master            # ← corrigido (era "main", que não existe)
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health/live
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: ENVIRONMENT
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: API_SCHEDULER_ENABLED
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: INTEGRATION_ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: DB_POOL_RECYCLE
        value: "1800"

  # ===== Worker (Background) =====
  # Processo separado que consome as filas do Redis (jobs em background).
  # startCommand roda apenas o consumidor. Cron jobs exigem worker.scheduler.
  - type: worker
    name: portal-b2b-worker
    runtime: docker
    repo: https://github.com/yagobarboza/portal-b2b
    plan: free
    branch: master            # ← corrigido (era "main")
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    startCommand: python -m worker.main
    envVars:
      - key: APP_ENV
        value: production
      - key: ENVIRONMENT
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: API_SCHEDULER_ENABLED
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: INTEGRATION_ENCRYPTION_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
