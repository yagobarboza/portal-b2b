name: CI — Portal B2B

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar .env
        run: |
          cp .env.example .env
          echo "SECRET_KEY=ci-secret-$(openssl rand -hex 16)" >> .env
          echo "SENTRY_DSN=" >> .env

      - name: Subir postgres e redis
        run: docker compose up -d postgres redis

      - name: Construir imagem da API (com pytest)
        run: docker compose build api

      - name: Aplicar migrations em processo exclusivo
        run: |
          docker compose run --rm api alembic upgrade head

      - name: Subir API sem executar migrations no boot
        run: docker compose up -d api

      - name: Rodar regressões críticas de integrações
        run: docker compose exec -T api python -m pytest tests_phase2/ tests_phase3/ tests_phase4/ tests_phase5/ tests_phase6/ tests_phase7/ -v

      - name: Validar imagem final de produção
        run: docker build --target runtime -t portal-b2b-runtime:${{ github.sha }} .
